name: Frontend checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "supabase/**"
      - "vercel.json"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "supabase/**"
      - "vercel.json"
      - ".github/workflows/frontend-checks.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
