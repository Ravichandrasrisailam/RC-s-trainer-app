server:
  port: 8080
  error:
    include-message: always
spring:
  application:
    name: rc-trainer-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rc_trainer}
    username: ${POSTGRES_USER:rc_trainer}
    password: ${POSTGRES_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-32-byte-minimum}
    expiration-minutes: 720
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
