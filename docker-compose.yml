services:
  postgres:
    image: postgres:16-alpine
    container_name: rc-trainer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rc_trainer}
      POSTGRES_USER: ${POSTGRES_USER:-rc_trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - rc_trainer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rc_trainer} -d ${POSTGRES_DB:-rc_trainer}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rc_trainer_data:
